# Local Ollama endpoint and chat model used by Spring AI.
# Checked-in default is gemma4:e4b (9.6 GB, Linux/CI-friendly) – see ../../ollama-model-links.md
# For local Mac (MLX) use gemma4:e4b-mlx via application-local.properties (not committed) or -Dspring.ai.ollama.chat.options.model=gemma4:e4b-mlx
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:e4b
# Thinking: enable model thinking for gemma4/lfm2.5 (tools+thinking). Values: true/false/low/medium/high
# See https://docs.spring.io/spring-ai/reference/api/chat/ollama-chat.html#_thinking_mode_reasoning and #_reasoning_content_via_openai_compatibility
spring.ai.ollama.chat.think=medium

# MCP client is disabled by default so unit tests run without external
# dependencies. To use the Polyglot sentiment server, start it on port 9000
# and flip this to true.
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.sse.connections.polyglot.url=http://localhost:9000

# Observability (BLUEPRINT Step 14): ChatModel calls are observed automatically via
# Micrometer – expose them at /actuator/metrics (gen_ai.client.token.usage after first call).
management.endpoints.web.exposure.include=health,info,metrics

# RAG (BLUEPRINT Step 10): disabled by default so tests/runs need no Postgres.
# Enable with --rag.enabled=true after `docker compose up -d pgvector ollama`.
rag.enabled=false
rag.datasource.url=jdbc:postgresql://localhost:5432/vector
rag.datasource.username=postgres
rag.datasource.password=postgres
rag.vectorstore.dimensions=768
# Ingest a document into the vector store on startup (BLUEPRINT verify: TUTORIAL.md)
rag.ingest.source=TUTORIAL.md
rag.ingest.on-startup=false

server.port=8081
