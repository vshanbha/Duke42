# Test profile. This file must AUGMENT the main application.properties, not replace it:
# Spring Boot loads both, but to avoid any shadowing of ollama/mcp/rag keys the
# needed keys are duplicated here. The Spring Shell interactive runner must not start
# (and block on stdin) while a Spring context is booted by integration/eval tests.
spring.shell.interactive.enabled=false
spring.main.web-application-type=none
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=gemma4:e4b-mlx
spring.ai.ollama.chat.think=medium
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.sse.connections.polyglot.url=http://localhost:9000
rag.enabled=false
rag.datasource.url=jdbc:postgresql://localhost:5432/vector
rag.datasource.username=postgres
rag.datasource.password=postgres
rag.vectorstore.dimensions=768
rag.ingest.source=TUTORIAL.md
rag.ingest.on-startup=false
