version: '3.8'

services:
  # Backend with Vaadin UI + REST API + MCP client
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SPRING_AI_MCP_CLIENT_ENABLED=false
    depends_on:
      - polyglot
    networks:
      - duke42

  # Polyglot MCP server (sentiment analysis)
  polyglot:
    build:
      context: .
      dockerfile: Dockerfile.polyglot
    ports:
      - "9000:9000"
    networks:
      - duke42

networks:
  duke42:
    driver: bridge
