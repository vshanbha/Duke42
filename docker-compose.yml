version: '3.8'

services:
  # BLUEPRINT dev-time services: local Ollama + pgvector for RAG
  # (CLI agent: --rag.enabled=true --rag.ingest.on-startup=true after `compose up -d`)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - duke42

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vector
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks:
      - duke42

  # Backend with Vaadin UI + REST API + MCP client
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SPRING_AI_MCP_CLIENT_ENABLED=false
    depends_on:
      - polyglot
    networks:
      - duke42

  # Polyglot MCP server (sentiment analysis)
  polyglot:
    build:
      context: .
      dockerfile: Dockerfile.polyglot
    ports:
      - "9000:9000"
    networks:
      - duke42

networks:
  duke42:
    driver: bridge

volumes:
  ollama-models:
  pgvector-data:
