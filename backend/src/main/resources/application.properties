# Local Ollama endpoint and chat model used by Spring AI.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=lfm2.5

# MCP client is disabled by default so unit tests run without external
# dependencies. To use the Polyglot sentiment server, start it on port 9000,
# set this property to true and restart the backend.
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.sse.connections.polyglot.url=http://localhost:9000

# `mvn spring-boot:run` is the documented local-development command. In that
# mode Vaadin must generate/serve the frontend instead of looking for the
# production bundle's classpath index.html. Running the packaged fat jar
# requires --vaadin.productionMode=true because vaadin-dev is excluded from it.
vaadin.productionMode=false

server.port=8080
