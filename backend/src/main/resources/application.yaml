spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: lfm2.5
    mcp:
      client:
        enabled: false
        sse:
          connections:
            polyglot:
              url: http://localhost:9000

# `mvn spring-boot:run` is the documented local-development command. In that
# mode Vaadin must generate/serve the frontend instead of looking for the
# production bundle's classpath index.html.
vaadin:
  productionMode: false

server:
  port: 8080
