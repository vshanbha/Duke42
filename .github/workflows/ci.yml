name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build CLI Agent
      run: cd spring-ai-cli-agent && mvn clean compile -q

    - name: Test CLI Agent
      run: cd spring-ai-cli-agent && mvn test -q

    - name: Build Backend
      run: cd backend && mvn clean compile -q

    - name: Test Backend (unit only)
      run: cd backend && mvn test -Dtest='!*E2ETest' -q

    - name: Build Backend JAR
      run: cd backend && mvn clean package -DskipTests -q

    - name: Test Backend E2E
      run: cd backend && mvn test -Dtest=E2ETest -q
      env:
        OLLAMA_BASE_URL: http://localhost:11434
