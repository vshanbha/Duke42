name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  factory-gates:
    name: Factory gate proofs (break/fix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Prove every installed gate fires (scripts/selftest/run.sh)
      run: ./scripts/selftest/run.sh

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install Ollama
      run: curl -fsSL https://ollama.com/install.sh | sh

    - name: Start Ollama and pull models
      run: |
        ollama serve &
        for i in $(seq 1 30); do
          curl -sf http://localhost:11434/api/tags && break
          sleep 2
        done
        ollama pull gemma4:e4b
        ollama pull lfm2.5

    - name: Build CLI Agent
      run: cd spring-ai-cli-agent && mvn clean compile -q

    - name: Test CLI Agent
      run: cd spring-ai-cli-agent && mvn test -q

    - name: Test CLI Agent RAG wiring against pgvector (Docker-gated)
      run: cd spring-ai-cli-agent && mvn test -Dtest=RagConfigurationTest -Dtc.pgvector=true -q

    - name: Build Backend (unit tests + package + E2E via failsafe)
      run: cd backend && mvn clean verify -q

    - name: Build Polyglot
      run: cd polyglot && mvn clean package -DskipTests -q
